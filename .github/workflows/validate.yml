name: Validate compose

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install --quiet yamllint
      - name: Lint compose files
        run: yamllint -c .yamllint */docker-compose.yml

  compose-config:
    name: docker compose config (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - authelia
          - crowdsec
          - dashy
          - nextcloud
          - proxdash
          - socket-proxy
          - traefik
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.stack }}
        working-directory: ${{ matrix.stack }}
        run: docker compose config -q
