#  SECCION: REDES

#  NOTA:  networks.proxy:
#         Red externa creada previamente (la define el stack de traefik)
networks:
  proxy:
    name: proxy
    external: true



#  SECCION: SECRETOS

#  NOTA:  secrets:
#         Authelia solicita estas variables a través de su archivo de configuración.
#         Se definen como secretos para evitar escribirlas a la vista en el compose.
secrets:
  JWT_SECRET:
    file: '$DOCKERDIR/authelia/config/secrets/jwt_secret'
  SESSION_SECRET:
    file: '$DOCKERDIR/authelia/config/secrets/session_secret'
  STORAGE_ENCRYPTION_KEY:
    file: '$DOCKERDIR/authelia/config/secrets/storage_encryption_key'
  AUTHELIA_SESSION_REDIS_PASSWORD:
    file: '$DOCKERDIR/authelia/config/secrets/authelia_session_redis_password'


#  SECCION: SERVICIOS
services:

  #  SERVICIO: Authelia - Portal de autenticación (forward-auth)

  #  NOTA:  authelia:
  #         Las variables cargadas como secretos se inyectan en el contenedor
  #         mediante las equivalencias *_FILE apuntando a /run/secrets/.
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - proxy
    expose:
      - 9091

    #  NOTA:  user:
    #         ID del usuario que ejecuta el contenedor en forma numérica.
    #         Sustituir en el archivo .env
    user: $PUID:$PGID

    secrets: ['JWT_SECRET', 'SESSION_SECRET', 'STORAGE_ENCRYPTION_KEY', 'AUTHELIA_SESSION_REDIS_PASSWORD']

    #  NOTA:  environment:
    #         $TZ: sustituir la zona horaria en el archivo .env
    environment:
      TZ: $TZ
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: '/run/secrets/JWT_SECRET'
      AUTHELIA_SESSION_SECRET_FILE: '/run/secrets/SESSION_SECRET'
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: '/run/secrets/STORAGE_ENCRYPTION_KEY'
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: '/run/secrets/AUTHELIA_SESSION_REDIS_PASSWORD'

    #  NOTA:  volumes:
    #         Sustituir la ruta en el archivo .env
    volumes:
      - $DOCKERDIR/authelia/config:/config

    #  NOTA:  labels:
    #         Sustituir el dominio en el archivo .env
    #           - tls.certresolver=cloudflare técnicamente no es necesario
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authelia.rule=Host(`auth.$DOMAINNAME`)'
      - 'traefik.http.routers.authelia.entrypoints=websecure'
      - 'traefik.http.routers.authelia.tls=true'
      - 'traefik.http.routers.authelia.tls.certresolver=cloudflare'
      - 'traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth'
      - 'traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true'
      - 'traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email'

  #  SERVICIO: Redis - Almacén de sesiones de Authelia

  redis:
    image: redis:alpine
    container_name: auth-redis
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 6379
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/authelia/redis:/data
