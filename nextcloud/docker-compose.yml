#  SECCION: REDES

#  NOTA:  networks.proxy:
#         Red externa creada previamente (la define el stack de traefik)
networks:
  proxy:
    external: true

  nextcloud:
    name: nextcloud


#  SECCION: SERVICIOS
services:

  #  SERVICIO: Nextcloud - Nube privada
  nextcloud:
    image: linuxserver/nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped
    networks:
      - nextcloud
      - proxy
    security_opt:
      - no-new-privileges:true

    #  NOTA:  environment:
    #         $TZ: listado de zonas https://www.joda.org/joda-time/timezones.html
    #         TRUSTED_PROXIES: la IP de Traefik (proxy). Ajustar según sea necesario
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAIN=cloud.$DOMAINNAME
      - TRUSTED_PROXIES=172.20.0.100

    #  NOTA:  volumes:
    #         Podemos agregar más carpetas. Ver README.md
    volumes:
      - $DOCKERDIR/nextcloud/config:/config
      - $DOCKERDIR/nextcloud/data:/data
      - /OTRAS/CARPETAS:/srv/EJEMPLO

    #  NOTA:  labels:
    #         chain-nextcloud@file es una cadena específica de Traefik para Nextcloud, definida en rules/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.nextcloud-rtr.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-rtr.rule=Host(`nextcloud.$DOMAINNAME`)"
      - "traefik.http.routers.nextcloud-rtr.tls=true"
      - "traefik.http.routers.nextcloud-rtr.middlewares=chain-nextcloud@file"
      - "traefik.http.routers.nextcloud-rtr.service=nextcloud-svc"
      - "traefik.http.services.nextcloud-svc.loadbalancer.server.scheme=https"
      - "traefik.http.services.nextcloud-svc.loadbalancer.server.port=443"

  #  SERVICIO: MariaDB - Base de datos de Nextcloud

  nextcloud-db:

    #  NOTA:  image:
    #         En el momento de escribir esto, 11.4 es la máxima versión compatible con Nextcloud.
    image: mariadb:11.4

    container_name: nextcloud-db
    hostname: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=msqyld-bin --binlog-format=ROW --skip-innodb-read-only-compressed
    networks:
      - nextcloud

    #  NOTA:  environment:
    #         MYSQL_ROOT_PASSWORD: contraseña de root de la base de datos
    #         MYSQL_PASSWORD: contraseña de usuario de la base de datos
    environment:
      - MYSQL_USER=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_ROOT_PASSWORD=$DB_ROOT_PASSWORD
      - MYSQL_PASSWORD=$DB_PASSWORD
    volumes:
      - $DOCKERDIR/nextcloud/mariadb:/var/lib/mysql

  #  SERVICIO: Redis - Caché de Nextcloud
  nextcloud-redis:
    image: redis:6.2-alpine
    container_name: nextcloud-redis
    hostname: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud
    volumes:
      - $DOCKERDIR/nextcloud/redis/data:/data
      - $DOCKERDIR/nextcloud/redis/sysctl.conf:/etc/sysctl.conf   # vm.overcommit_memory = 1
