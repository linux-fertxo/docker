#  SECCION: REDES
networks:
  socket_proxy:
    name: socket_proxy


#  SECCION: SERVICIOS
services:

  #  SERVICIO: Socket Proxy - Proxy de solo lectura para el socket de Docker

  #  NOTA:  socket-proxy:
  #         Expone una API filtrada del socket de Docker (ghcr.io/tecnativa/docker-socket-proxy).
  #         privileged es necesario para poder acceder al socket real.
  socket-proxy:
    container_name: socket-proxy
    hostname: socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: always
    networks:
      - socket_proxy
    privileged: true

    #  NOTA:  ports:
    #         Este puerto debe exponerse únicamente a la red interna (127.0.0.1).
    #           - Para manejar múltiples endpoints de docker en una red local: - "2375:2375"
    ports:
      - 127.0.0.1:2375:2375

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $DOCKERDIR/socket-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template

    #  NOTA:  environment:
    #         Los nombres de las variables coinciden con el path de la URL
    #           - P.Ej.: AUTH bloquea el acceso a todo /auth/* como partes del API, etc.
    #           - Usamos 0 para prohibir el acceso, 1 para autorizarlo.
    #         LOG_LEVEL: de menor a mayor importancia:
    #           - debug, info, notice, warning, err, crit, alert, emerg
    environment:
      - DISABLE_IPV6=1
      - LOG_LEVEL=info

      #  INFO:  Autorizados por defecto
      - EVENTS=1
      - PING=1
      - VERSION=1

      #  INFO:  Prohibidos por defecto

      #  SUB:   Seguridad crítica
      - AUTH=0
      - SECRETS=0
      - POST=0

      #  SUB:   Necesarios según el servicio
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1      # Traefik, portainer, etc.
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1          # Portainer
      - INFO=1            # Portainer
      - NETWORKS=1        # Portainer
      - NODES=0
      - PLUGINS=0
      - SERVICES=1        # Portainer
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1           # Portainer
      - VOLUMES=1         # Portainer
