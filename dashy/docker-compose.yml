#  SECCION: REDES
networks:
  dashy:
    name: dashy


#  SECCION: SERVICIOS
services:

  #  SERVICIO: Dashy - Panel de inicio (dashboard)

  #  NOTA:  dashy.image:
  #         Es más fiable fijar una versión concreta de imagen que usar la etiqueta latest
  dashy:
    image: lissy93/dashy:4.8.0
    container_name: dashy
    hostname: dashy
    restart: unless-stopped
    networks:
      - dashy
    ports:
      - 4000:8080

    #  NOTA:  environment:
    #         UID / GID: ID del usuario y grupo que ejecuta el contenedor.
    #           - Ejecutar `id usuario` en la máquina host para averiguarlos
    environment:
      - NODE_ENV=production
      - UID=$UID
      - GID=$GID

    #  NOTA:  volumes (opcional):
    #         Sección de certificados, configuración de Dashy y carpetas con assets.
    #         dashy.yml se crea durante el primer arranque, pero podemos cargar una configuración previa
    # volumes:
    #   - $ACME_PATH/ejemplo.cer:/etc/ssl/certs/dashy-pub.pem:ro
    #   - $ACME_PATH/ejemplo.key:/etc/ssl/certs/dashy-priv.key:ro
    #   - $DOCKERDIR/dashy/dashy.yml:/app/user-data/conf.yml
    #   - $DOCKERDIR/dashy/icons:/app/public/item-icons/
    #   - $DOCKERDIR/dashy/fonts:/app/public/fonts/

    #  NOTA:  healthcheck (opcional):
    #         Configuración del chequeo de salud de Dashy
    healthcheck:
      test: ['CMD-SHELL', 'yarn health-check']
      interval: 5m
      retries: 3
      start_period: 1m
      timeout: 30s
